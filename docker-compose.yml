# ─────────────────────────────────────────────────────────────────────────────
# Dokploy production compose — kopahi.com brand site (Next.js) behind Traefik.
#
# HYBRID MODEL: this repo now ships ONLY the Next.js brand site. All commerce
# (shop, cart, checkout, accounts, vendor dashboards, blog) lives on WordPress
# at shop.kopahi.com, deployed separately. The old Node backend, admin SPA and
# Postgres database are retired.
#
# Required env vars (set in Dokploy → project → Environment):
#   FRONTEND_HOST   bare hostname, no scheme (e.g. kopahi.com)
# ─────────────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ./kopahi-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.kopahi-frontend.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.routers.kopahi-frontend.entrypoints=websecure"
      - "traefik.http.routers.kopahi-frontend.tls=true"
      - "traefik.http.routers.kopahi-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.kopahi-frontend.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
